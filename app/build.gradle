plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.dexicon'
    compileSdk 36

    defaultConfig {
        // -PstockTest builds a side-by-side test install (com.eurobuddha.dexicon.stock) that pairs with its own node row
        // and shares no data with an installed Dexicon — used to prove the Trading Account on stock Minima Core.
        applicationId "com.eurobuddha.dexicon" + (project.hasProperty('stockTest') ? '.stock' : '')
        minSdk 28
        targetSdk 35
        // Every code change bumps BOTH (pre-commit hook .githooks/pre-commit enforces it).
        // 0.3.54: review of the Pandamonium tab - alerts/pool warnings posted with tags and the maker's foreground id moved
        // (7601 = Atelier's), host user never opening Dexicon gets no maker/heartbeat, host-mode wording (no pairing, never
        // "clear storage"), stuck-lock test switch only on Android 11+, old PandaPools notification taps still open Dexicon.
        // 0.3.55: host mode - return the node's old PandaDEX resting orders (owner cancel ported from PandaDEX) from an Assets
        // card; "Start fresh with the node's current keys" on the identity-halt card (the in-app reinstall: rescue first, no
        // unsettled swap). Standalone unchanged.
        // 0.3.56: host mode - the Assets ETH card names a standalone ETH Wallet / node-key AtomiX that would share this
        // Ethereum key when paired with the host's node (warning only: one signer, never exclusion).
        // 0.3.57: DexiconActivity hosts the screen in its own frame (a host's wrapper around the content - Pandamonium's
        // app menu - survives the screen's own swaps). Owner 14 Nov: in Pandamonium Dexicon is an app-list app, not a tab.
        // 0.3.58: inside a host the host pads for the system bars (no double gap at top / above the host footer); a ✕ in the
        // header returns to the host (Pandamonium full-screen Dexicon tab).
        // 0.3.59: host language API (HostMode.setTranslator / tr / translateTree / translated) - Pandamonium shows Dexicon in
        // its chosen language (zh-Hans / ru / uk); labels only, never typed text. Standalone: no translator, unchanged.
        // 0.3.64: Trading Account - "Search the archive again" (SETTINGS > TRADING ACCOUNT): the full MegaMMR archive pass on
        // demand, mark or no mark, with a plain result naming the archive; the automatic pass re-opens when the node lost the
        // account's script rows (reseed / restore of an older backup of the same node folder).
        // 0.3.65: Trading Account seeds in plain words - a separate wallet even with the node's 24 words, new words are the
        // better choice, one device at a time: before the first choice, beside the same-words paths, under "Show 24 words",
        // and in SETTINGS > TRADING ACCOUNT > ABOUT THIS ACCOUNT (existing accounts are not prompted again).
        // 0.3.66: "ONE device at a time" no longer says "at the same moment" - a phone that resumes after the account was
        // restored elsewhere can collide for about a day; the first phone must stop using it for good.
        // 0.3.67: archive mark (review): a lost-and-registered address is looked for in the node's own chain again; a pass
        // that started before such a loss never records the mark after it (generation); the pending reset is kept in prefs.
        // 0.3.68: "Search the archive again" (review): uses the calling screen's node connection; an unusable archive reply is
        // named as such; the dialog lives in the shared AccountSetup, keeps its result when closed and holds no screen.
        // 0.3.69: the vendored MinimaHtlc is byte-identical to AtomiX again: host mode's "start fresh" forgets the swap
        // identity through a Dexicon-side shim (doors/HtlcIdentity), same effect.
        versionCode 369
        versionName "0.3.69"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true   // BuildConfig.VERSION_NAME in the header pill
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty; a release must not silently use a debug key.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // No R8: lazysodium (+ JNA) and org.json are reflection-heavy (same call as AtomiX).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    testOptions {
        unitTests {
            // A REAL org.json is on the test classpath (see testImplementation); never stub it.
            returnDefaultValues = false
            includeAndroidResources = true   // Robolectric: the DOORS tab smoke test inflates the real Activity
            all { maxHeapSize = '2g' }
        }
    }
}

// No jdk18on BouncyCastle on the APP's runtime classpath (debug/release — what ships in the APK): it lacks gmss (minima.jar's
// Winternitz) and duplicates every jdk15on class (duplicate-class dex failure). Fails the build the moment such a
// classpath resolves. JVM-test classpaths are exempt: Robolectric itself brings bcprov-jdk18on there.
configurations.configureEach { conf ->
    if (conf.name.endsWith('RuntimeClasspath') && !conf.name.contains('UnitTest') && !conf.name.contains('AndroidTest')) conf.incoming.afterResolve { deps ->
        def bad = deps.resolutionResult.allComponents.findAll { c -> c.moduleVersion != null && c.moduleVersion.group == 'org.bouncycastle' && c.moduleVersion.name.endsWith('jdk18on') }
        if (!bad.isEmpty()) throw new GradleException("${conf.name}: BouncyCastle jdk18on is forbidden (no gmss; pin bcprov-jdk15on): ${bad*.moduleVersion.join(', ')}")
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Minima Core IPC client SDK — the ONLY way this app reaches the node. Auditable, bounded sources are
    // compiled from src/main/java/com/eurobuddha/minimaapi (PandaDEX's vendored transport); app/libs/minimaapi.aar
    // is kept beside it for parity with the scaffold but is not referenced.

    // Identity: X25519 sealed box + Ed25519 (libsodium via Lazysodium), keys derived from the node seed (AtomiX).
    implementation 'com.goterl:lazysodium-android:5.1.0@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // DOORS (vendored AtomiX taker engine): secp256k1 key derivation, legacy tx signing (RLP) and ABI encode/decode —
    // the same pure-Java web3j modules AtomiX uses (no okhttp/core; JSON-RPC is EthRpc over HttpURLConnection).
    implementation 'org.web3j:crypto:4.9.8'
    implementation 'org.web3j:abi:4.9.8'
    implementation 'org.web3j:rlp:4.9.8'
    implementation 'org.web3j:utils:4.9.8'

    // ② POOLS (vendored PandaPools engine, scripts/vendor-pandapools.sh): Pandamonium's pinned Minima wire codecs for the
    // proof-only MegaMMR recovery (app/libs/MINIMA-PROVENANCE.md), and SVG token icons (PandaPools' ImageLoader).
    implementation files('libs/minima.jar')
    // BouncyCastle, PINNED (family rule): minima.jar's Winternitz signer lives in org.bouncycastle.pqc.crypto.gmss, which
    // BC 1.71+ (every jdk18on release) removed. web3j would otherwise decide the version transitively. 1.69 = what
    // minima-core and apks/wallet ship; it also carries PandaPools' SHA3Digest. Never jdk18on (the check below fails the build).
    implementation('org.bouncycastle:bcprov-jdk15on') { version { strictly '1.69' } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    // AtomiX's Fund / QR (vendored comms/QrUtil): QR generation only, the version standalone AtomiX ships
    implementation 'com.google.zxing:core:3.5.3'

    // ---- Local JVM unit tests (src/test) ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // DOORS: the vendored AtomiX engine's own JVM tests (ported with it) mock comms.NodeApi and run SwapDb on Robolectric.
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Desktop libsodium so the REAL identity derivation / seal / sign run in JVM tests (same libsodium as the AAR).
    testImplementation 'com.goterl:lazysodium-java:5.1.4'
    testImplementation 'net.java.dev.jna:jna:5.13.0'
}
